<header class="site-header">
  <a class="site-brand" href="{{ .Site.Home.RelPermalink }}" aria-label="{{ i18n "home" }} — {{ i18n "siteTitle" }}">
    <span class="brand-mark" aria-hidden="true">H<span class="brand-dot">.</span></span>
    <span class="brand-name">{{ i18n "siteTitle" }}</span>
  </a>
  <nav class="primary-nav" aria-label="{{ i18n "journal" }}">
    {{ $home := .IsHome }}
    <a href="{{ .Site.Home.RelPermalink }}"{{ if $home }} aria-current="page"{{ end }}>{{ i18n "home" }}</a>
    {{ with .Site.GetPage "/posts" }}<a href="{{ .RelPermalink }}"{{ if eq $.Section "posts" }} aria-current="{{ if $.IsPage }}location{{ else }}page{{ end }}"{{ end }}>{{ i18n "posts" }}</a>{{ end }}
    {{ with .Site.GetPage "/tags" }}<a href="{{ .RelPermalink }}"{{ if eq $.Section "tags" }} aria-current="page"{{ end }}>{{ i18n "tags" }}</a>{{ end }}
  </nav>
</header>
