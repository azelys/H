{{ $taxonomy := .taxonomy }}
{{ with .page.GetTerms $taxonomy }}
<div class="terms">
  <div class="terms-label">{{ if eq $taxonomy "tags" }}{{ i18n "tags" }}{{ else if eq $taxonomy "categories" }}{{ i18n "categories" }}{{ else }}{{ humanize $taxonomy }}{{ end }}:</div>
  <ul class="terms-list">{{ range . }}<li class="term-item"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>{{ end }}</ul>
</div>
{{ end }}
