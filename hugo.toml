baseURL = 'https://azelys.github.io/H/'
languageCode = 'en-us'
title = 'Hallucinations'
theme = 'blog'

# Detect Japanese text for accurate summaries and reading-time estimates.
hasCJKLanguage = true

# Separate content roots keep each language out of the other language builds.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

[languages]
	[languages.en]
		languageName = "English"
		languageCode = "en"
		weight = 1
		# English originals
		contentDir = "content/en"

	[languages.fa]
		languageName = "فارسی"
		languageCode = "fa"
		weight = 2
		contentDir = "content/fa"
		languageDirection = "rtl"

	[languages.fr]
		languageName = "Français"
		languageCode = "fr"
		weight = 3
		contentDir = "content/fr"

	[languages.ja]
		languageName = "日本語"
		languageCode = "ja"
		weight = 4
		contentDir = "content/ja"
